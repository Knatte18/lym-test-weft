binary: ${env:LYX_SHUTTLE_CLAUDE:-} # path to the claude executable; empty falls back to "claude" on PATH — prefer an explicit path, PATH aliases can hit the 0-byte WindowsApps stub
deny_agent_tool: true # emit a PreToolUse deny for the in-process Agent tool
deny_ask_user_question: true # emit a PreToolUse deny for the AskUserQuestion tool (autonomous runs only)
