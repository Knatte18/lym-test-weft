deploy_branches: ["main"] # list of base branch names a landing into which batten's Land row deploys, by running deploy; a list because tasks branch off other tasks, and only a landing into a listed branch is deployed; empty deploys nothing
squash: true # whether Finalize's parent-side merge squashes; true because a run produces one commit per card and an ordinary merge floods the parent with implementation noise
conflict: opus[effort=high] # model-spec for the conflict-resolution session both producers' resolver runs under (see contracts/specs/llm-model-spec.md)
conflict_timeout_min: 60 # minutes the conflict-resolution session's shuttle run is allowed to run
describe: sonnet[medium] # model-spec for the Describe row's session, which writes the change description that becomes the PR title and body and the landing commit message (see contracts/specs/llm-model-spec.md)
describe_timeout_min: 30 # minutes the Describe session's shuttle run is allowed to run
engine_trailers:
    claude: 'Co-Authored-By: Claude <noreply@anthropic.com>'
deploy: "" # shell command batten's Land row runs in the prime after a landing into a branch listed in require_pr_to_base; empty runs nothing; the same trust class as publish_verify
parent_lock_idle_release_min: 10 # minutes a waiting run, or an undecided PR-Gate hand-off, keeps its parent lock before the lock is released; a value below 1 reads as 10
